name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No version here: package.json's packageManager field is the single
      # source of truth, and specifying both makes the action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium for the corpus suite
        run: pnpm exec playwright install --with-deps chromium

      # Renders every fixture and round-trips it through the semantic model,
      # failing on any parse error, render error, or pitch drift.
      - name: Corpus and import fidelity
        run: pnpm corpus

      # Drives the built app in a real browser across six journeys, standing up
      # the API and sync services against a throwaway data directory.
      - name: End-to-end suites
        run: pnpm e2e
