name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium for the corpus suite
        run: pnpm exec playwright install --with-deps chromium

      # Renders every fixture and round-trips it through the semantic model,
      # failing on any parse error, render error, or pitch drift.
      - name: Corpus and import fidelity
        run: pnpm corpus
