name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No version here: package.json's packageManager field is the single
      # source of truth, and specifying both makes the action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # Runs the compiled services under plain node with the environment DEPLOY.md
      # specifies. Every other step here exercises the code through a dev server or a
      # bundler; this one exercises the thing that would actually be deployed, which
      # until recently did not exist — both services built with `tsc --noEmit`. Cheap,
      # deterministic, and it catches a devDependency reaching production code, which
      # is invisible in dev and fatal after `pnpm install --prod`.
      - name: Deployable artifacts
        run: pnpm deploycheck

      - name: Install Chromium for the corpus suite
        run: pnpm exec playwright install --with-deps chromium

      # Renders every fixture and round-trips it through the semantic model,
      # failing on any parse error, render error, or pitch drift.
      - name: Corpus and import fidelity
        run: pnpm corpus

      # Synthesizes every score to raw samples and measures it. Nobody has
      # heard this app — it is built and tested in headless browsers with no
      # audio device — so silence is the one failure nothing else would catch.
      - name: Audio output
        run: pnpm audio

      # Our own timeline against what alphaTab actually plays, by synthesizing
      # each score to its end and comparing total length. The timeline is what
      # every view drawn from our model reads, so drift here shows up as notes
      # landing in the wrong place — and this is what found a bar being given the
      # length of its written beats rather than the length of its meter.
      - name: Timeline agrees with playback
        run: pnpm timing

      # Our MIDI export against alphaTab's, for every score. The unit tests grade
      # our writer against our own reader, which cannot catch a mistake both halves
      # make; this reads alphaTab's file with our parser, so the writer is graded
      # against an independent implementation and the parser against an independent
      # writer at once. It is what found ties being re-articulated as second
      # note-ons — 1,616 extra note events in one nine-minute file.
      - name: MIDI export agrees with alphaTab
        run: pnpm midi
      # Our MusicXML handed to alphaTab's own MusicXML reader. Same argument as the
      # step above, plus the one claim about guitar MusicXML that most exporters
      # quietly fail: it counts how many notes came back still carrying a string and
      # a fret rather than as pitches somebody has to finger again.
      - name: MusicXML agrees with alphaTab
        run: pnpm musicxml

      # Audio back to notation, graded against labels the corpus generates for free:
      # timeline() says exactly what a perfect detector would report for each file, so
      # every score is a worked example nobody had to annotate. Runs on the committed
      # fixtures here — the real Guitar Pro files are gitignored, so a developer with a
      # corpus grades a harder set than CI does.
      - name: Transcription accuracy
        run: pnpm transcribe

      # Drives the built app in a real browser across every journey, standing up the
      # API and sync services against a throwaway data directory.
      - name: End-to-end suites
        run: pnpm e2e

      # `pnpm editperf` is deliberately NOT run here. It is a wall-clock gate, and on a
      # shared runner the same six keystrokes have measured a 2x spread, so it would fail
      # for reasons that have nothing to do with the commit. It also needs the gitignored
      # corpus to measure anything that matters: without it the only score available is
      # four bars, which passes trivially. Run it locally with a corpus. See
      # tools/edit-perf.mjs and STANDALONE.md §3.
