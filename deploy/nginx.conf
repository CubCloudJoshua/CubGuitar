# The one thing in front of everything.
#
# Three jobs, and the app cannot work without any of them: terminate TLS, serve the
# static bundle, and put the API and the sync socket on the same origin as the page.
# Same origin is not cosmetic — the session cookie is SameSite=Lax and the client
# asks for /api and /ws as relative paths (apps/web/vite.config.ts does the same
# thing with a dev proxy), so a deployment that puts the API on another hostname
# gets a browser that never sends the cookie.
#
# TLS is left to whatever issues the certificate. Put the certbot or Caddy config
# in the server block below; COOKIE_SECURE=1 in compose.yml is a promise that this
# block is HTTPS, and if it is not, the cookie is dropped by the browser and nobody
# can stay signed in.

upstream cubscore_api {
    server api:8787;
}

upstream cubscore_sync {
    server sync:8788;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A .gp file import is a POST of the file as base64, and MAX_BODY in the API is
    # 24 MB. Nginx defaults to 1 MB, which rejects the request before the API ever
    # sees it — the import fails with a 413 from a component the app cannot report
    # on, so it reads as the importer being broken.
    client_max_body_size 24m;

    # Hashed filenames, so these can be cached hard. The two fonts and the
    # soundfont are 5.9 MB between them and never change without a new hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /font/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /soundfont/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://cubscore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 in the API means "trust exactly one hop and take the
        # address that hop appended". $proxy_add_x_forwarded_for appends the real
        # peer to whatever the client sent, which is what makes the last token
        # trustworthy and every per-IP rate limit real. Without it every user
        # shares one bucket and one busy client locks out the rest.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://cubscore_sync;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A collab session is idle whenever nobody is typing, and nginx's default
        # 60s read timeout closes an idle upgrade. The room lives in the sync
        # service's memory, so a dropped socket is a dropped session.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback, last. Every route the app owns is client-side, so a reload on
    # any path other than / must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
