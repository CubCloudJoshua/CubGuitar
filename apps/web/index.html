<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CubScore</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #080808;
        color: #eee;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      /* Focus must stay visible for keyboard users even though mouse clicks
         release focus so the spacebar keeps driving the transport. */
      :focus-visible {
        outline: 2px solid #ff9120;
        outline-offset: 1px;
      }
      /*
        UI-DESIGN.md: motion explains, never decorates, and the preference is
        honored fully. Components style transitions inline, so only !important
        under this query can override them; near-zero rather than zero keeps
        transitionend/animationend listeners firing.
      */
      /* The share card springs in from the press that made it. */
      @keyframes cub-share-in {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
